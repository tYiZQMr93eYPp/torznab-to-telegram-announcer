[project]
name = "torznab-to-telegram-announcer"
version = "1.0.0"
description = "torznab-to-telegram-announcer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apprise>=2.1.0",
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
torznab-to-telegram-announcer = "torznab_to_telegram_announcer:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

